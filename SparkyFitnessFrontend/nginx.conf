server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Exact route for ApexTrainer AI Chat.
  # Browser calls: /api/ai/chat
  # Nginx forwards to FastAPI Gateway: /chat
  location = /api/ai/chat {
    proxy_pass http://apextrainer-ai-gateway:8000/chat;
    proxy_http_version 1.1;

    # Forward the logged-in user's Better Auth cookie.
    proxy_set_header Cookie $http_cookie;
    proxy_set_header User-Agent $http_user_agent;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    proxy_connect_timeout 10s;
    proxy_read_timeout 150s;
    proxy_send_timeout 150s;
  }

  # ApexTrainer AI Gateway routes.
  #
  # Examples:
  # /api/ai/conversations
  #   -> http://apextrainer-ai-gateway:8000/conversations
  #
  # /api/ai/conversations/<id>/messages
  #   -> http://apextrainer-ai-gateway:8000/conversations/<id>/messages
  #
  # The exact /api/ai/chat route above remains in place.
  location /api/ai/ {
    proxy_pass http://apextrainer-ai-gateway:8000/;
    proxy_http_version 1.1;

    # Forward the authenticated user's Better Auth cookie.
    proxy_set_header Cookie $http_cookie;
    proxy_set_header User-Agent $http_user_agent;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    proxy_connect_timeout 10s;
    proxy_read_timeout 150s;
    proxy_send_timeout 150s;
  }

  # Existing ApexTrainer backend API routes.
  location /api/ {
    proxy_pass http://apextrainer-server:3010/api/;
    proxy_http_version 1.1;

    proxy_set_header Cookie $http_cookie;
    proxy_set_header User-Agent $http_user_agent;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
  }

  # React frontend routes.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
